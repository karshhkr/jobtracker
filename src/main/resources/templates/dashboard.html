<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JobTrackr - Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="dashboard">
    <div class="topbar">
        <h1>JobTrackr</h1>
        <button id="logoutBtn">Logout</button>
    </div>

    <h2>Add Application</h2>
    <form id="addForm">
        <input type="text" id="company" placeholder="Company" required>
        <input type="text" id="roleTitle" placeholder="Role" required>
        <label>Follow-up date (optional): <input type="date" id="followUpDate"></label>
        <button type="submit">Add Application</button>
    </form>
    <p id="addError" class="error"></p>

    <h2>Your Applications</h2>
    <table id="appTable">
        <thead>
        <tr><th>Company</th><th>Role</th><th>Status</th><th>Applied</th><th>Follow-up</th></tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
    const token = localStorage.getItem('jwt');
    if (!token) window.location.href = '/login';

    async function loadApplications() {
        const res = await fetch('/api/applications', {
            headers: { 'Authorization': 'Bearer ' + token }
        });

        if (res.status === 401 || res.status === 403) {
            localStorage.removeItem('jwt');
            window.location.href = '/login';
            return;
        }

        const apps = await res.json();
        const tbody = document.querySelector('#appTable tbody');
        tbody.innerHTML = '';
        apps.forEach(app => {
            const row = document.createElement('tr');
            row.innerHTML = `<td>${app.company}</td><td>${app.roleTitle}</td><td>${app.status}</td><td>${app.appliedDate || ''}</td><td>${app.followUpDate || ''}</td>`;
            tbody.appendChild(row);
        });
    }

    document.getElementById('addForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const company = document.getElementById('company').value;
        const roleTitle = document.getElementById('roleTitle').value;
        const followUpDate = document.getElementById('followUpDate').value || null;

        const res = await fetch('/api/applications', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({ company, roleTitle, followUpDate })
        });

        if (!res.ok) {
            const err = await res.json();
            document.getElementById('addError').textContent = err.error || 'Could not add application';
            return;
        }

        document.getElementById('addForm').reset();
        document.getElementById('addError').textContent = '';
        loadApplications();
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('jwt');
        window.location.href = '/login';
    });

    loadApplications();
</script>
</body>
</html>
