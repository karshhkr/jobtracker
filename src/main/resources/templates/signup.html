<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JobTrackr - Sign up</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="auth">
    <div class="card">
        <h1>Create your account</h1>
        <p class="sub">Free for up to 10 applications.</p>
        <div class="error" id="err"></div>
        <form id="authForm" data-endpoint="register">
            <label for="name">Name</label>
            <input id="name" name="name" required maxlength="100" autocomplete="name">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required autocomplete="email">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required minlength="6" autocomplete="new-password">
            <div class="actions" style="justify-content:stretch">
                <button class="btn" style="width:100%" type="submit">Sign up</button>
            </div>
        </form>
        <p class="muted" style="text-align:center;margin-bottom:0">Already registered? <a th:href="@{/login}">Log in</a></p>
    </div>
</main>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/auth.js}"></script>
</body>
</html>
