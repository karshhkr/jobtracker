<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JobTrackr - Log in</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="auth">
    <div class="card">
        <h1>Welcome back</h1>
        <p class="sub">Log in to track your job search.</p>
        <div class="error" id="err"></div>
        <form id="authForm" data-endpoint="login">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required autocomplete="email">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required minlength="6" autocomplete="current-password">
            <div class="actions" style="justify-content:stretch">
                <button class="btn" style="width:100%" type="submit">Log in</button>
            </div>
        </form>
        <p class="muted" style="text-align:center;margin-bottom:0">No account? <a th:href="@{/signup}">Create one</a></p>
    </div>
</main>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/auth.js}"></script>
</body>
</html>
