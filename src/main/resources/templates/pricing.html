<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JobTrackr - Pricing</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: navbar('pricing')}"></div>
<main class="container">
    <h1 style="text-align:center;margin-bottom:0">Simple pricing</h1>
    <p class="muted" style="text-align:center">Most offers come after the follow-up, not the application.</p>
    <div class="plans">
        <div class="card plan">
            <h2>Free</h2>
            <div class="price">Rs 0</div>
            <ul><li>Up to 10 applications</li><li>Status pipeline</li><li>In-app follow-up reminders</li></ul>
        </div>
        <div class="card plan featured">
            <h2>Pro</h2>
            <div class="price" id="price">...</div>
            <ul><li>Unlimited applications</li><li>Email follow-up reminders</li><li>Pay per month, no auto-renewal</li></ul>
            <button class="btn" id="upgradeBtn" style="width:100%" type="button">Upgrade to Pro</button>
            <p class="muted" id="proNote" style="margin-bottom:0"></p>
        </div>
    </div>
</main>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/pricing.js}"></script>
</body>
</html>
