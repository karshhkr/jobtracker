spring.application.name=jobtracker
# ---------- Database ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jobtracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ---------- JPA + Flyway: schema sirf Flyway banata hai ----------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.thymeleaf.cache=false

# ---------- Business rules ----------
app.free-limit=10
app.pro-price-paise=19900
app.pro-days=30
app.mail-from=${MAIL_FROM:noreply@jobtracker.app}
app.reminder-cron=0 0 9 * * *


# ---------- JWT ----------
jwt.secret=${JWT_SECRET:dev-only-secret-dev-only-secret-dev-only-1234}
jwt.expiration-ms=86400000

# ---------- Razorpay ----------
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_replace_me}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:replace_me}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:replace_me}


# ---------- Mail (Gmail SMTP) ----------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------- Logging ----------
logging.level.org.springframework.security=INFO


app.mock-payments=${MOCK_PAYMENTS:false}